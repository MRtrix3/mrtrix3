name: clang-tidy-review

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
         sudo apt update
         sudo apt install qt6-base-dev libqt6opengl6-dev libglvnd-dev libeigen3-dev zlib1g-dev libfftw3-dev ninja-build

    - name: Run CMake
      run: cmake . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMRTRIX_USE_PCH=OFF

    - uses: ZedThree/clang-tidy-review@v0.21.0
      id: review
      with:
        apt_packages: g++,qt6-base-dev,libqt6opengl6-dev,libglvnd-dev,zlib1g-dev,libfftw3-dev,ninja-build
        config_file: .clang-tidy-review
        clang_tidy_version: 19
        # PRs from forks get a read-only GITHUB_TOKEN, which can't post a review
        # (see the 403 "Resource not accessible by integration" failure). Generate
        # the review here and post it from clang-tidy-post.yml instead, which runs
        # via workflow_run in the base repo's context and has write access.
        split_workflow: true

    - uses: ZedThree/clang-tidy-review/upload@v0.21.0
      id: upload-review
